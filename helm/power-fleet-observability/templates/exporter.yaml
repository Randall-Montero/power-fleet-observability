apiVersion: apps/v1
kind: Deployment
metadata:
  name: power-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app: power-exporter
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.exporter.replicaCount }}
  selector:
    matchLabels:
      app: power-exporter
  template:
    metadata:
      labels:
        app: power-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: exporter
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.port }}
          env:
            - name: POWER_SOURCE
              value: "{{ .Values.exporter.powerSource }}"
            - name: SCENARIO
              value: "{{ .Values.exporter.scenario }}"
            - name: EXPORTER_PORT
              value: "{{ .Values.exporter.port }}"
            - name: SCRAPE_INTERVAL
              value: "{{ .Values.exporter.scrapeInterval }}"
          resources:
            {{- toYaml .Values.exporter.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.exporter.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: {{ .Values.exporter.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: power-exporter
  namespace: {{ .Values.namespace }}
  labels:
    app: power-exporter
spec:
  selector:
    app: power-exporter
  ports:
    - name: metrics
      port: {{ .Values.exporter.port }}
      targetPort: metrics
