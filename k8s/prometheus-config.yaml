---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: power-fleet
data:
  prometheus.yml: |
    global:
      scrape_interval:     15s
      evaluation_interval: 15s
      external_labels:
        cluster: minikube
        environment: lab

    rule_files:
      - /etc/prometheus/rules/*.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager:9093"]

    scrape_configs:
      # ── Power Fleet exporter ─────────────────────────────────────────────
      - job_name: power_fleet_exporter
        static_configs:
          - targets: ["power-exporter:8000"]
        metrics_path: /metrics

      # ── Prometheus self-monitoring ───────────────────────────────────────
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
