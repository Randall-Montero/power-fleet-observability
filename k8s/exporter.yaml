---
# ServiceAccount for the exporter (no cluster permissions needed for simulated source)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: power-exporter
  namespace: power-fleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: power-exporter
  namespace: power-fleet
  labels:
    app: power-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: power-exporter
  template:
    metadata:
      labels:
        app: power-exporter
    spec:
      serviceAccountName: power-exporter
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: exporter
          image: power-fleet-observability:latest
          imagePullPolicy: Never          # use local Minikube image
          ports:
            - name: metrics
              containerPort: 8000
          env:
            - name: POWER_SOURCE
              value: "simulated"
            - name: SCENARIO
              value: ""                   # inject scenarios at runtime
            - name: EXPORTER_PORT
              value: "8000"
            - name: SCRAPE_INTERVAL
              value: "15"
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: power-exporter
  namespace: power-fleet
  labels:
    app: power-exporter
spec:
  selector:
    app: power-exporter
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
