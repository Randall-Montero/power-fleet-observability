---
# The Gmail App Password lives in the Secret "alertmanager-gmail", which is
# deliberately NOT part of this file so re-applying it never overwrites the real
# password. Create it with scripts/create_gmail_secret.sh (see README).
# ── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: power-fleet
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost:  smtp.gmail.com:587
      smtp_from:       randall.montero28@gmail.com
      smtp_auth_username: randall.montero28@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/gmail_password
      smtp_require_tls: true

    templates: []

    route:
      group_by:        ['alertname', 'frame', 'lpar', 'vios']
      group_wait:      30s
      group_interval:  5m
      repeat_interval: 1h
      receiver:        gmail
      routes:
        - match:
            severity: critical
          receiver: gmail
          continue: true
        - match:
            severity: critical
          receiver: webhook-backup

    receivers:
      - name: gmail
        email_configs:
          - to: randall.montero28@gmail.com
            send_resolved: true
            headers:
              Subject: '[{{ .Status | toUpper }}] Power Fleet Alert: {{ .GroupLabels.alertname }}'
            html: |
              <h2>Power Fleet Alert</h2>
              {{ range .Alerts }}
              <p><b>{{ .Annotations.summary }}</b><br/>
              {{ .Annotations.description }}</p>
              {{ end }}

      - name: webhook-backup
        webhook_configs:
          - url: "http://webhook-sink:5001/alerts"
            send_resolved: true

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ['alertname', 'frame', 'lpar']
---
# ── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: power-fleet
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
          ports:
            - name: web
              containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: gmail-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
          resources:
            requests:
              cpu:    "50m"
              memory: "64Mi"
            limits:
              cpu:    "200m"
              memory: "128Mi"
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: gmail-secret
          secret:
            secretName: alertmanager-gmail
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: power-fleet
  labels:
    app: alertmanager
spec:
  type: NodePort
  selector:
    app: alertmanager
  ports:
    - name: web
      port: 9093
      targetPort: web
      nodePort: 30093
