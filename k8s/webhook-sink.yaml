---
# Minimal webhook receiver: logs every Alertmanager POST to stdout.
# View with: kubectl logs -n power-fleet deploy/webhook-sink
apiVersion: v1
kind: ConfigMap
metadata:
  name: webhook-sink-script
  namespace: power-fleet
data:
  sink.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", 0)))
            try:
                payload = json.loads(body)
                for a in payload.get("alerts", []):
                    print(f"[{a.get('status')}] {a['labels'].get('alertname')} "
                          f"{a['labels']} - {a['annotations'].get('summary')}", flush=True)
            except Exception:
                print(body.decode(errors="replace"), flush=True)
            self.send_response(200)
            self.end_headers()

        def log_message(self, *args):
            pass

    HTTPServer(("0.0.0.0", 5001), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-sink
  namespace: power-fleet
  labels:
    app: webhook-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-sink
  template:
    metadata:
      labels:
        app: webhook-sink
    spec:
      containers:
        - name: sink
          image: python:3.12-slim
          command: ["python", "-u", "/app/sink.py"]
          ports:
            - name: http
              containerPort: 5001
          volumeMounts:
            - name: script
              mountPath: /app
          resources:
            requests:
              cpu:    "10m"
              memory: "32Mi"
            limits:
              cpu:    "100m"
              memory: "64Mi"
      volumes:
        - name: script
          configMap:
            name: webhook-sink-script
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-sink
  namespace: power-fleet
  labels:
    app: webhook-sink
spec:
  selector:
    app: webhook-sink
  ports:
    - name: http
      port: 5001
      targetPort: http
